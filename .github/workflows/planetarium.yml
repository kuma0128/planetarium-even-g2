name: Planetarium

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
      - run: uv run --locked scripts/update-catalog.py
      - name: Verify catalog reproducibility
        run: git diff --exit-code -- src/data public/licenses/HYG.md public/licenses/D3-Celestial.txt
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: g2-planetarium
          path: g2-planetarium.ehpk
          if-no-files-found: error
